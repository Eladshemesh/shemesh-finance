<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<meta name="description" content="ניתוח מניות ומדדים יומי בעברית: דוחות כספיים, קונצנזוס וול סטריט, שווי הוגן ותחזיות">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="הדקה של שמש">
<title>הדקה הכלכלית של שמש</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a single dark trading-terminal column; summary first (verdict, outlook), detail after (financials, analysts), learning and sources last. */
:root {
  --bg: #0F172A;
  --panel: #131C31;
  --panel-2: #18233D;
  --line: #24314F;
  --text: #E5EAF3;
  --muted: #93A0B8;
  --green: #10B981;
  --red: #EF4444;
  --blue: #3B82F6;
  --gold: #E9B949;
  --amber: #F59E0B;
  --font-display: "Frank Ruhl Libre", "David Libre", Georgia, serif;
  --font-body: "Heebo", "Assistant", "Segoe UI", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
a { color: #8BB6FF; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; unicode-bidi: isolate; direction: ltr; display: inline-block; }
.mono { font-family: var(--font-mono); letter-spacing: .02em; }
.wrap { max-width: 1180px; margin: 0 auto; padding: env(safe-area-inset-top) max(20px, env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); }
@media (max-width: 520px) {
  .wrap { padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); }
  .hero .price { font-size: 36px; }
  .hero .nm h2 { font-size: 28px; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .strip { grid-template-columns: 1fr 1fr; }
  .sec-h h2 { font-size: 21px; }
  .bar-row { grid-template-columns: 96px 1fr 46px; }
  .rec .tag { font-size: 28px; }
  .search input { font-size: 16px; }
}
.install { display: flex; gap: 12px; align-items: center; justify-content: space-between; background: rgba(233,185,73,.08); border: 1px solid rgba(233,185,73,.4); border-radius: 12px; padding: 10px 14px; font-size: 14px; margin-top: 12px; }

/* header */
.top { padding: 28px 0 18px; display: grid; gap: 18px; }
.brand { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.sun { width: 54px; height: 54px; flex: none; }
.brand h1 { font-family: var(--font-display); font-weight: 900; font-size: clamp(28px, 4.4vw, 44px); line-height: 1.05; letter-spacing: -.01em; }
.brand h1 .acc { color: var(--gold); }
.badge-acc { display: inline-flex; align-items: baseline; gap: 6px; border: 1px solid rgba(233,185,73,.45); color: var(--gold); padding: 3px 12px; border-radius: 999px; font-weight: 700; font-size: 14px; background: rgba(233,185,73,.07); }
.sub { color: var(--muted); font-size: 14px; }
.meta-line { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
.meta-line b { color: var(--text); font-weight: 600; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; margin-inline-end: 6px; box-shadow: 0 0 0 3px rgba(16,185,129,.18); }

.search { position: relative; }
.search form { display: flex; gap: 10px; }
.search input { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 12px; padding: 14px 16px; font-size: 16px; font-family: var(--font-body); }
.search input::placeholder { color: #66748F; }
.btn { background: var(--blue); color: #fff; border: 0; border-radius: 12px; padding: 0 20px; font-weight: 700; font-size: 15px; cursor: pointer; font-family: var(--font-body); min-height: 44px; }
.btn:hover { filter: brightness(1.1); }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
.btn.gold { background: var(--gold); color: #1b1404; }
.sugg { position: absolute; inset-inline: 0; top: calc(100% + 6px); background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; z-index: 20; overflow: hidden; box-shadow: 0 12px 30px rgba(0,0,0,.4); }
.sugg button { display: flex; justify-content: space-between; width: 100%; padding: 10px 14px; background: none; border: 0; color: var(--text); cursor: pointer; font-family: var(--font-body); font-size: 15px; text-align: start; }
.sugg button:hover, .sugg button.on { background: rgba(59,130,246,.15); }

.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.tick { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; text-align: start; color: var(--text); font-family: var(--font-body); display: grid; gap: 2px; }
.tick:hover { border-color: #3a4a70; }
.tick.on { border-color: var(--gold); box-shadow: inset 0 0 0 1px rgba(233,185,73,.35); }
.tick .row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.tick .sym { font-family: var(--font-mono); font-weight: 600; }
.tick .px { font-weight: 700; }

/* sections */
section.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px; margin-top: 16px; }
@media (max-width: 520px) { section.card { padding: 16px; } }
.sec-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.sec-h h2 { font-family: var(--font-display); font-size: 25px; font-weight: 700; }
.sec-h .hint { color: var(--muted); font-size: 13px; }
.kicker { color: var(--gold); font-size: 12px; font-weight: 700; letter-spacing: .08em; }

.jump { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.jump button { background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; font-family: var(--font-body); }
.jump button:hover { color: var(--text); }

/* hero */
.hero { display: grid; grid-template-columns: 1.1fr 1.9fr; gap: 22px; align-items: start; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; } }
.hero .nm { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.hero .nm h2 { font-family: var(--font-display); font-size: 34px; font-weight: 900; }
.hero .tk { font-family: var(--font-mono); color: var(--muted); font-size: 15px; }
.hero .price { font-size: 46px; font-weight: 800; line-height: 1.1; margin-top: 8px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; }
.kpi { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.kpi .l { color: var(--muted); font-size: 12px; }
.kpi .v { font-size: 19px; font-weight: 700; }
.kpi .s { color: var(--muted); font-size: 11.5px; }
.up { color: var(--green); } .down { color: var(--red); }

/* verdict */
.verdict { display: grid; grid-template-columns: 300px 1fr; gap: 22px; }
@media (max-width: 860px) { .verdict { grid-template-columns: 1fr; } }
.rec { border-radius: 16px; padding: 18px; display: grid; gap: 10px; align-content: start; border: 1px solid var(--line); background: var(--panel-2); }
.rec .tag { font-family: var(--font-display); font-size: 34px; font-weight: 900; line-height: 1.1; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 12.5px; font-weight: 700; border: 1px solid currentColor; white-space: nowrap; }
.c-sb { color: #34D399; } .c-b { color: var(--green); } .c-h { color: var(--amber); } .c-s { color: var(--red); }
.score-big { display: flex; align-items: baseline; gap: 6px; }
.score-big .n { font-size: 40px; font-weight: 800; }
.bars { display: grid; gap: 7px; }
.bar-row { display: grid; grid-template-columns: 116px 1fr 52px; gap: 8px; align-items: center; font-size: 13px; }
.track { height: 8px; background: #0c1324; border-radius: 99px; overflow: hidden; }
.fill { height: 100%; border-radius: 99px; background: var(--blue); }
.fill.neg { background: var(--red); }
.entry { border: 1px dashed rgba(233,185,73,.5); border-radius: 12px; padding: 10px 12px; background: rgba(233,185,73,.05); }
.pc { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 700px) { .pc { grid-template-columns: 1fr; } }
.pc .col { background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; border-top: 3px solid var(--green); }
.pc .col.risk { border-top-color: var(--red); }
.pc h3 { font-size: 16px; margin-bottom: 8px; }
.pc ol { margin: 0; padding-inline-start: 20px; display: grid; gap: 8px; }
.news { margin-top: 14px; color: var(--muted); font-size: 13.5px; display: grid; gap: 4px; }

/* outlook */
.ol-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 18px; }
@media (max-width: 860px) { .ol-grid { grid-template-columns: 1fr; } }
.chart { width: 100%; direction: ltr; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th, table.t td { padding: 8px 8px; border-bottom: 1px solid var(--line); text-align: start; vertical-align: top; }
table.t th { color: var(--muted); font-weight: 500; font-size: 12.5px; }
table.t td.n, table.t th.n { text-align: left; direction: ltr; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl-wrap { overflow-x: auto; }
.method { color: var(--muted); font-size: 13px; margin-top: 10px; line-height: 1.65; }
.method summary { cursor: pointer; color: var(--text); font-weight: 600; }

/* financials */
.seg { display: inline-flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { background: none; border: 0; color: var(--muted); padding: 7px 14px; border-radius: 9px; cursor: pointer; font-family: var(--font-body); font-size: 14px; font-weight: 600; }
.seg button.on { background: var(--blue); color: #fff; }
.fin-note { color: var(--muted); font-size: 13.5px; margin: 0 0 14px; max-width: 75ch; }
.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 860px) { .charts { grid-template-columns: 1fr; } }
.ch { background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 14px 12px 6px; }
.ch h3 { font-size: 15px; margin: 0 4px 2px; }
.ch .cap { color: var(--muted); font-size: 12.5px; margin: 0 4px 6px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 14px; }
.tiles2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 8px 4px 12px; }

/* analysts */
.cons { display: grid; grid-template-columns: 1fr 1.3fr; gap: 18px; margin-bottom: 16px; }
@media (max-width: 860px) { .cons { grid-template-columns: 1fr; } }
.dist { display: flex; height: 14px; border-radius: 99px; overflow: hidden; margin: 8px 0; }
.range { position: relative; height: 46px; margin: 10px 8px 0; direction: ltr; }
.range .ln { position: absolute; top: 20px; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, rgba(239,68,68,.6), rgba(245,158,11,.6), rgba(16,185,129,.6)); border-radius: 99px; }
.range .mk { position: absolute; top: 10px; width: 2px; height: 26px; background: var(--text); }
.range .mk span { position: absolute; top: -18px; transform: translateX(-50%); font-size: 11.5px; white-space: nowrap; color: var(--muted); }
.range .mk.cur { background: var(--gold); }
.range .mk.cur span { color: var(--gold); top: 28px; font-weight: 700; }
.banks { display: grid; grid-template-columns: repeat(auto-fit, minmax(205px, 1fr)); gap: 12px; }
.bk { background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; align-content: start; }
.bk .firm { font-weight: 800; font-size: 15.5px; }
.bk .tgt { font-size: 22px; font-weight: 800; }
.bk .note { color: var(--muted); font-size: 13px; }
.bk .when { color: #6E7C97; font-size: 12px; }
.stars { color: var(--gold); letter-spacing: 2px; }

/* macro + learn */
.macro { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.learn { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 860px) { .learn { grid-template-columns: 1fr; } }
.lc { background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.lc h3 { font-family: var(--font-display); font-size: 21px; margin-bottom: 8px; }
.lc h4 { font-size: 15px; margin: 12px 0 4px; color: var(--gold); }
.lc p { margin: 0 0 8px; max-width: 68ch; }
.lc ul { margin: 0; padding-inline-start: 20px; display: grid; gap: 6px; }
.formula { font-family: var(--font-mono); background: #0c1324; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; direction: ltr; text-align: center; margin: 6px 0 10px; font-size: 14px; }
.example { border-inline-start: 3px solid var(--blue); padding: 4px 12px; background: rgba(59,130,246,.06); border-radius: 0 8px 8px 0; margin: 8px 0; font-size: 14px; }
.calc { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
.calc label { font-size: 12.5px; color: var(--muted); display: grid; gap: 4px; }
.calc input { background: #0c1324; border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 9px 10px; font-size: 16px; direction: ltr; font-family: var(--font-body); }
.full { grid-column: 1 / -1; }

.src-list { display: grid; gap: 6px; padding-inline-start: 20px; margin: 6px 0 0; font-size: 14px; }
.disc { color: var(--muted); font-size: 12.5px; margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; line-height: 1.7; }
.state { padding: 60px 0; text-align: center; color: var(--muted); }
.req { display: grid; gap: 10px; }
.req .q { display: flex; gap: 8px; flex-wrap: wrap; }
.req .q span { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-family: var(--font-mono); font-size: 13px; }
.muted { color: var(--muted); }

/* freshness, decision card, guide */
.fresh { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted); font-weight: 500; letter-spacing: 0; white-space: nowrap; }
.fdot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.lights { display: inline-flex; gap: 5px; }
.light { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
.pillars { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 960px) { .pillars { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 620px) { .pillars { grid-template-columns: 1fr; } }
.pillar { background: var(--panel-2); border: 1px solid var(--line); border-top: 3px solid var(--line); border-radius: 0 0 14px 14px; padding: 14px 16px; display: grid; gap: 8px; align-content: start; }
.pillar h3 { font-size: 16px; }
.pillar .pl { margin: 0; font-size: 14px; }
.pillar dl { margin: 0; display: grid; gap: 5px; }
.pillar dl div { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; border-bottom: 1px dashed var(--line); padding-bottom: 4px; }
.pillar dt { color: var(--muted); }
.pillar dd { margin: 0; font-weight: 700; }
.pillar details { font-size: 13px; color: var(--muted); }
.pillar details summary { cursor: pointer; color: #8BB6FF; }
.pillar details p { margin: 6px 0 0; }
.guide { border-color: rgba(233,185,73,.4); }
.g-steps { margin: 0 0 14px; padding: 0; list-style: none; counter-reset: g; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 860px) { .g-steps { grid-template-columns: 1fr; } }
.g-steps li { counter-increment: g; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 12px 14px; display: grid; gap: 4px; font-size: 14px; }
.g-steps li b::before { content: counter(g) ". "; color: var(--gold); }
.g-steps li span { color: var(--muted); }
.g-how { display: grid; gap: 8px; font-size: 14px; max-width: 95ch; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* personal tools */
.alert-bar { margin-top: 14px; background: rgba(16,185,129,.12); border: 1px solid rgba(16,185,129,.5); border-radius: 12px; padding: 10px 14px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.lnk { background: none; border: 0; padding: 0; color: #8BB6FF; cursor: pointer; font: inherit; text-decoration: underline; text-underline-offset: 3px; text-align: start; }
.actbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.actbar .btn { min-height: 38px; font-size: 14px; padding: 0 14px; }
.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; cursor: pointer; }
.chk input { width: 18px; height: 18px; accent-color: var(--blue); }
.seg button.on { background: var(--blue); color: #fff; }
.cmp-pick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
@media (max-width: 620px) { .cmp-pick { grid-template-columns: 1fr; } }
.cmp-pick select, .num-in, .tk-in input { background: var(--panel-2); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 10px 12px; font-size: 15px; font-family: var(--font-body); min-height: 44px; }
table.t.cmp td.best { color: var(--green); font-weight: 800; }
table.t.cmp td.best::after { content: " ✓"; }
.lights.sm .light { width: 14px; height: 14px; }
.tk-in { display: flex; gap: 8px; flex-wrap: wrap; }
.tk-in input:first-child { flex: 1 1 200px; }
.tk-extra { display: contents; }
.num-in { width: 130px; direction: ltr; text-align: left; }
td .num-in { width: 110px; min-height: 36px; padding: 6px 8px; }
.chipbtn { background: var(--panel-2); border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; font-family: var(--font-body); margin-inline-start: 6px; }
.x { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; width: 32px; height: 32px; cursor: pointer; }
.x:hover { color: var(--red); border-color: var(--red); }
.note-warn { background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.45); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; margin-bottom: 10px; }
.wbar { display: inline-block; width: 48px; height: 6px; background: var(--line); border-radius: 9px; vertical-align: middle; overflow: hidden; }
.wbar span { display: block; height: 100%; background: var(--blue); }
tr.lots td { background: var(--panel-2); }
.lot { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 4px 0; font-size: 13.5px; }
.evs { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.evs li { display: grid; grid-template-columns: 120px 1fr; gap: 12px; background: var(--panel-2); border: 1px solid var(--line); border-inline-start: 4px solid var(--line); border-radius: 10px; padding: 10px 14px; }
@media (max-width: 520px) { .evs li { grid-template-columns: 1fr; } }
.ev-d { display: grid; } .ev-b { display: grid; gap: 4px; font-size: 14px; }

/* round 3 */
.mode { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
.mode button { background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 6px 14px; font-family: var(--font-body); font-size: 14px; font-weight: 700; cursor: pointer; min-height: 36px; }
.mode button.on { background: var(--gold); color: #1b1404; border-color: var(--gold); }
.morning { background: linear-gradient(160deg, rgba(233,185,73,.10), rgba(59,130,246,.06) 60%, transparent), var(--panel); }
.morning .lead { font-family: var(--font-display); font-size: clamp(20px, 2.6vw, 26px); font-weight: 700; margin: 0 0 14px; line-height: 1.35; }
.mk3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
@media (max-width: 520px) { .mk3 { grid-template-columns: 1fr 1fr; } }
.mgrid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 18px; }
@media (max-width: 860px) { .mgrid { grid-template-columns: 1fr; } }
.mgrid h3 { font-size: 17px; margin-bottom: 6px; }
